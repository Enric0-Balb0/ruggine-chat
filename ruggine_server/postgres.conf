# PostgreSQL configuration for Ruggine production deployment
# Optimized for HIGH PERFORMANCE - 16 cores / 16GB RAM

# Connection Settings - Increased for high concurrency
max_connections = 200                # Increased from 100 for better concurrency
listen_addresses = '*'

# Memory Settings - Optimized for 6GB allocated to PostgreSQL container
shared_buffers = 1536MB             # 25% of allocated memory (6GB)
effective_cache_size = 4608MB       # 75% of allocated memory
work_mem = 16MB                     # Increased from 4MB for complex queries
maintenance_work_mem = 256MB        # Increased from 64MB for maintenance operations
wal_buffers = 64MB                  # Increased from 16MB for write performance

# CPU Settings - Optimized for 6 cores allocated
max_worker_processes = 6            # Match allocated CPU cores
max_parallel_workers = 6            # Enable parallel query execution
max_parallel_workers_per_gather = 3 # Half of max_parallel_workers
max_parallel_maintenance_workers = 3

# Checkpoint Settings - Optimized for write performance
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min          # Increased from default for better batching
checkpoint_flush_after = 256kB      # Enable incremental checkpoint flushing
default_statistics_target = 100

# WAL Settings - Optimized for high write throughput
wal_level = replica                  # Required for replication
wal_compression = on                 # Compress WAL records
wal_log_hints = on                   # Enable WAL hints for better performance

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 10MB

# Log what we care about for monitoring
log_min_duration_statement = 1000  # Log slow queries (1 second)
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'none'

# Performance - Optimized for SSD and high concurrency
random_page_cost = 1.1              # Optimized for SSD storage
seq_page_cost = 1.0                 # Sequential access cost
effective_io_concurrency = 200      # High for SSD
maintenance_io_concurrency = 100    # Parallel maintenance operations

# Autovacuum - Aggressive settings for high-write workloads
autovacuum = on
autovacuum_max_workers = 3          # Increased from default
autovacuum_naptime = 30s            # More frequent autovacuum runs
autovacuum_vacuum_threshold = 50    # Lower threshold for small tables
autovacuum_analyze_threshold = 25   # More frequent analyze

# JIT Compilation - Enable for complex queries
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# Security
ssl = off  # Enable if you have SSL certificates
password_encryption = md5

# Locale
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# Timezone
timezone = 'UTC'

# Shared preload libraries
shared_preload_libraries = ''

# Enable query plan statistics
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
