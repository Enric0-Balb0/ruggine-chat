[package]
name = "ruggine_server"
version = "0.1.0"
edition = "2021"

[lib]
name = "ruggine_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
headers = "0.4"
hyper = { version = "1.0", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1.24.2", features = ["macros", "rt-multi-thread", "time"] }
tower = { version = "0.4.13", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
dotenv = "0.15.0"
serde =  { version = "1.0.152", features = ["derive"] }
jsonwebtoken = "8.3.0"
thiserror = "1.0.40"
dashmap = "7.0.0-rc2"
chrono = {version = "0.4.24", features = ["serde"]}
bcrypt = "0.14.0"
serde_json = "1.0.95"
mockall = "0.11.4"
sqlx = { version = "0.6.3", default-features = false, features = [
  "runtime-tokio-native-tls",
  "postgres",          # o "mysql" o "sqlite"
  "chrono",
  "migrate",
  "macros",
  "time"
] }
validator = { version = "0.16.0", features = ["derive"] }
async-trait = "0.1.68"
tracing = "0.1"
tracing-subscriber = "0.3.17"
once_cell = "1.19"
rand = "0.8"
utoipa = { version = "4.2", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
strum = "0.25"
strum_macros = "0.25"
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-util = "0.7"
tungstenite = "0.24.0"
form_urlencoded = "1.2.1"
tokio-tungstenite = "0.24.0"
url = "2.5.4"
reqwest = { version = "0.12.23", features = ["json"] }

[dev-dependencies]
# Test-specific dependencies
tokio-test = "0.4"
tokio-shared-rt = "0.1"
futures = "0.3"
env_logger = "0.10"
serial_test = "3.0"  # For tests that cannot run in parallel
tempfile = "3.5"    # For temporary files in tests
tower = { version = "0.4.13", features = ["util", "make"] }  # For testing services
futures-util = "0.3"  # For WebSocket stream handling

# [[test]]
# name = "user_repository_unit"
# path = "tests/unit/repository/user_repository_test.rs"

# [[test]]
# name = "user_dto_unit"
# path = "tests/unit/dto/user_dto_test.rs"

# [[test]]
# name = "user_repository_integration"
# path = "tests/integration/repository/user_repository_test.rs"

# Ottimizzazioni di compilazione
[profile.dev]
debug = true
# incremental = true
opt-level = 0

[profile.test]
debug = true
# incremental = true
opt-level = 0

# Ottimizza le dipendenze per velocizzare i build
# [profile.dev.package."*"]
# opt-level = 1
# debug = false

# [profile.test.package."*"]
# opt-level = 1
# debug = false

