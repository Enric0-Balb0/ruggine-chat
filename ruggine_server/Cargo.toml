[package]
name = "ruggine_server"
version = "0.1.0"
edition = "2021"

[lib]
name = "ruggine_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.6.3", features = ["headers"] }
hyper = { version = "0.14.23", features = ["full"] }
tokio = { version = "1.24.2", features = ["full"] }
tower = { version = "0.4.13", features = ["full"] }
tower-http = { version = "0.4.0", features = ["full"] }
dotenv = "0.15.0"
serde =  { version = "1.0.152", features = ["derive"] }
jsonwebtoken = "8.3.0"
thiserror = "1.0.40"
chrono = {version = "0.4.24", features = ["serde"]}
bcrypt = "0.14.0"
serde_json = "1.0.95"
mockall = "0.11.4"
sqlx = { version = "0.6.3", features = ["runtime-tokio-native-tls", "migrate", "chrono", "time"] }
validator = { version = "0.16.0", features = ["derive"] }
async-trait = "0.1.68"
sqlx-cli = "0.6.3"
tracing-subscriber = "0.3.17"

[dev-dependencies]
# Test-specific dependencies
tokio-test = "0.4"
futures = "0.3"
env_logger = "0.10"
serial_test = "3.0"  # For tests that cannot run in parallel
tempfile = "3.5"    # For temporary files in tests

# Integration test configurations
[[test]]
name = "user_repository_unit"
path = "tests/unit/repository/user_repository_test.rs"

[[test]]
name = "user_repository_integration"
path = "tests/integration/repository/user_repository_test.rs"

