services:
  # Production Database with better configuration
  ruggine_db:
    image: postgres:17-alpine
    container_name: ruggine_database
    environment:
      POSTGRES_DB: ruggine_prod
      POSTGRES_USER: ruggine_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ruggine_secure_password}
      POSTGRES_HOST_AUTH_METHOD: md5
      # PostgreSQL Performance Tuning
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - ruggine_db_data:/var/lib/postgresql/data
      - ./seeds:/docker-entrypoint-initdb.d:ro
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruggine_user -d ruggine_prod"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ruggine_network
    restart: unless-stopped
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Main Rust application server
  ruggine_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruggine_app_server
    environment:
      # Database configuration
      DATABASE_URL: postgresql://ruggine_user:${POSTGRES_PASSWORD:-ruggine_secure_password}@ruggine_db:5432/ruggine_prod
      
      # Server configuration
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8002
      PORT: 8002
      
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET:-your_super_secure_jwt_secret_change_this_in_production}
      JWT_TTL_IN_MINUTES: ${JWT_TTL_IN_MINUTES:-1440}
      
      # Application environment
      RUST_ENV: production
      RUST_LOG: ${RUST_LOG:-info}
      
      # Performance monitoring
      ENABLE_CPU_LOGGING: ${ENABLE_CPU_LOGGING:-true}
      LOG_IN_MILLISECONDS: ${LOG_IN_MILLISECONDS:-120000}
      CPU_LOG_INTERVAL_MINUTES: 2
    ports:
      - "8002:8002"
    depends_on:
      ruggine_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ruggine_network
    restart: unless-stopped
    # Resource limits for performance optimization
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Nginx reverse proxy for production (optional)
  ruggine_proxy:
    image: nginx:alpine
    container_name: ruggine_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ruggine_server
    networks:
      - ruggine_network
    restart: unless-stopped
    profiles:
      - proxy

  # Redis for session storage and caching (optional)
  ruggine_redis:
    image: redis:7-alpine
    container_name: ruggine_redis
    ports:
      - "6379:6379"
    volumes:
      - ruggine_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ruggine_network
    restart: unless-stopped
    profiles:
      - cache

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: ruggine_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - ruggine_network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana for metrics visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: ruggine_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ruggine_network
    restart: unless-stopped
    profiles:
      - monitoring

# Named volumes for persistent data
volumes:
  ruggine_db_data:
    driver: local
    name: ruggine_database_volume
  ruggine_redis_data:
    driver: local
    name: ruggine_redis_volume
  prometheus_data:
    driver: local
    name: ruggine_prometheus_volume
  grafana_data:
    driver: local
    name: ruggine_grafana_volume

# Custom network for inter-service communication
networks:
  ruggine_network:
    driver: bridge
    name: ruggine_network
    ipam:
      config:
        - subnet: 172.20.0.0/16
