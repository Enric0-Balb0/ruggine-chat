version: '3.8'

services:
  test_db:
    image: mysql:8.0
    container_name: ruggine_test_db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ruggine_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    ports:
      - "3307:3306"  # Porta diversa da quella di produzione
    volumes:
      - test_db_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - test_network

volumes:
  test_db_data:
    driver: local

networks:
  test_network:
    driver: bridge
