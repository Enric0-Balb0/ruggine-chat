[package]
name = "ruggine_client-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
# Dependencies per il build script che genera i tipi dal server
[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde", "wasm-bindgen"] }
thiserror = "1.0"
web-sys = "0.3"
gloo-storage = "0.3"
log = "0.4"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "js"] }

[workspace]
members = ["src-tauri"]

[dev-dependencies]
# Test dependencies
wasm-bindgen-test = "0.3"
tokio = { version = "1.0", features = ["full"] }  # Added tokio for async tests
tokio-test = "0.4"
mockall = "0.11.4"       
serial_test = "3.0"        
futures = "0.3"          
env_logger = "0.10"      
serde_json = "1.0"
# WASM-specific testing
js-sys = "0.3"
web-sys = "0.3"
# HTTP mocking for client
mockito = "1.0"
# Browser automation for E2E
fantoccini = "0.19"
