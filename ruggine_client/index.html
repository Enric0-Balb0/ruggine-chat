<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Ruggine Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA / favicon -->
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="logos/logo-light.png">
  <link rel="apple-touch-icon" href="logos/logo-light.png">
  <!-- fallback favicon.ico (optional) -->
  <link rel="shortcut icon" href="logos/logo-light.png">
    <link data-trunk rel="css" href="src/styles/tailwind.css" />
    <link data-trunk rel="copy-dir" href="public" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <script>
      // Simple cache-busting version used by views when referencing static assets.
      // Update manually or replace at build-time if needed.
      window.RUGGINE_BUILD_VERSION = "1";
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Custom scrollbar styles for registration form -->
    <style>
      /* Dark mode scrollbar for form container - highest priority */
      .dark .form-container-scroll::-webkit-scrollbar {
        width: 8px !important;
      }
      
      .dark .form-container-scroll::-webkit-scrollbar-track {
        background: #2a2a2a !important;
        border-radius: 4px;
      }
      
      .dark .form-container-scroll::-webkit-scrollbar-thumb {
        background: #404040 !important;
        border-radius: 4px;
      }
      
      .dark .form-container-scroll::-webkit-scrollbar-thumb:hover {
        background: #555555 !important;
      }
      
      .dark .form-container-scroll::-webkit-scrollbar-thumb:active {
        background: #666666 !important;
      }
      
      /* Light mode scrollbar for form container */
      .form-container-scroll::-webkit-scrollbar {
        width: 8px !important;
      }
      
      .form-container-scroll::-webkit-scrollbar-track {
        background: rgba(243, 242, 241, 0.3) !important;
        border-radius: 4px;
      }
      
      .form-container-scroll::-webkit-scrollbar-thumb {
        background: rgba(138, 136, 134, 0.6) !important;
        border-radius: 4px;
      }
      
      .form-container-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(138, 136, 134, 0.8) !important;
      }
      
      /* Firefox support */
      .dark .form-container-scroll {
        scrollbar-width: thin !important;
        scrollbar-color: #404040 #2a2a2a !important;
      }
      
      .form-container-scroll {
        scrollbar-width: thin !important;
        scrollbar-color: rgba(138, 136, 134, 0.6) rgba(243, 242, 241, 0.3) !important;
      }
    </style>
    <!-- Force chat spacing overrides (injected last so it takes precedence) -->
    <style>
      /* Uniform intra-group gap */
      .msg-wrapper.continued, div[id^="msg-"].continued { margin-bottom: 2px !important; }
      /* First message: top margin separates groups; bottom matches intra-group */
      .msg-wrapper.first, div[id^="msg-"].first { margin-top: 1rem !important; margin-bottom: 2px !important; }
      .chat-msg { margin-bottom: 0 !important; }
    </style>
  </head>
  <body></body>
</html>
